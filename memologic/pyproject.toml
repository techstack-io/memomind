[project]
name = "memologic"
version = "0.1.0"
description = "A production-ready Retrieval-Augmented Generation (RAG) application built with LangChain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.139.0",
    "isort>=8.0.1",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "openai>=2.44.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]
